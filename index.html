<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Kurumsal Teklif Sistemi</title>
    <style>
        /* =========================================
           EKRAN GÖRÜNÜMÜ (KOYU MOD FORM)
           ========================================= */
        :root {
            --bg-color: #121212; --surface-color: #1e1e1e;
            --primary-color: #3b82f6; --text-main: #e0e0e0;
            --text-muted: #9e9e9e; --border-color: #333333;
        }
        
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 10px; box-sizing: border-box; overflow-x: hidden; }
        
        #formArea { width: 100%; max-width: 100%; margin: 0 auto; background-color: var(--surface-color); padding: 15px; box-sizing: border-box; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow-x: hidden; }
        
        .header { border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box; }
        
        .sirket-adi-input { background: transparent; border: 1px dashed var(--primary-color); color: #ffffff; font-size: 24px; font-weight: bold; text-align: center; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 5px; }
        .sirket-adi-input:focus { outline: none; border: 1px solid var(--primary-color); background-color: #2c2c2c; }
        .sirket-adi-info { font-size: 11px; color: var(--text-muted); text-align: center; }

        .section-title { font-size: 16px; color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-top: 30px; margin-bottom: 15px; text-transform: uppercase; width: 100%; box-sizing: border-box; }
        
        .form-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; box-sizing: border-box; }
        
        .form-group { display: flex; flex-direction: column; width: 100%; box-sizing: border-box; }
        label { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        
        input, textarea, select { width: 100%; box-sizing: border-box; background-color: #2c2c2c; border: 1px solid var(--border-color); color: #ffffff; padding: 12px; border-radius: 8px; font-size: 16px; font-family: inherit; margin: 0; }
        
        input[type="date"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            display: block;
            min-height: 44px;
        }
        
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary-color); }
        input[readonly] { background-color: #1a1a1a; color: #4ade80; font-weight: bold; border: none; }
        
        .urun-karti { background-color: #242424; border: 1px solid #444; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
        .urun-karti-sil { position: absolute; top: 10px; right: 10px; background: #e53e3e; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; z-index: 10;}
        .btn-ekle { background-color: #4a5568; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 20px; font-size: 15px; box-sizing: border-box; }
        
        .toplam-alani { background-color: #1a1a1a; border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-align: right; font-size: 18px; color: #4ade80; font-weight: bold; margin-bottom: 20px; width: 100%; box-sizing: border-box; }

        .btn-pdf { background-color: #e53e3e; color: white; }
        .btn-wp { background-color: #25D366; color: white; }
        button.islem-btn { padding: 15px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; transition: opacity 0.2s; box-sizing: border-box; }
        button.islem-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div id="formArea">
    <div class="header">
        <!-- oninput ile yazılan her harfi telefonun hafızasına kaydeder -->
        <input type="text" id="v_sirket_adi" class="sirket-adi-input" value="FATİH AVM" oninput="localStorage.setItem('hafiza_sirket', this.value)">
        <div class="sirket-adi-info">Teklif Sisteminin Sahibi (Burayı değiştirirseniz sistem bu ismi hep hatırlar)</div>
    </div>

    <div class="section-title">Müşteri & Evrak Bilgileri</div>
    <div class="form-grid">
        <div class="form-group">
            <label>Müşteri Adı / Ünvanı</label>
            <input type="text" id="v_musteri" placeholder="">
        </div>
        <div class="form-group">
            <label>Teklif Tarihi</label>
            <input type="date" id="v_tarih">
        </div>
        <div class="form-group">
            <label>Teklif No (Otomatik)</label>
            <input type="text" id="v_refno" readonly>
        </div>
    </div>

    <div class="section-title">Ürünler / Paket İçeriği</div>
    <div id="urunlerKapsayici"></div>
    <button class="btn-ekle" onclick="urunKartiEkle()">+ Yeni Ürün Ekle</button>

    <div class="toplam-alani">
        Genel Toplam: <span id="v_genelToplamEkran">0 ₺</span>
    </div>

    <div class="section-title">Ticari Şartlar & İletişim</div>
    <div class="form-grid">
        <div class="form-group">
            <label>Termin / Teslimat (Gün)</label>
            <input type="number" id="v_termin_gun" placeholder="">
        </div>
        <div class="form-group">
            <label>Ödeme Şekli</label>
            <select id="v_odeme">
                <option value="Kredi Kartı Tek Çekim">Kredi Kartı Tek Çekim</option>
                <option value="Kredi Kartı Taksit">Kredi Kartı Taksit</option>
                <option value="Nakit">Nakit</option>
                <option value="Elden Taksit 6 Ay">Elden Taksit 6 Ay</option>
                <option value="Elden Taksit 12 Ay">Elden Taksit 12 Ay</option>
                <option value="Elden Taksit 15 Ay">Elden Taksit 15 Ay</option>
            </select>
        </div>
        <div class="form-group">
            <label>Geçerlilik Tarihi</label>
            <input type="date" id="v_gecerlilik">
        </div>
        <div class="form-group">
            <label>Danışman Adı</label>
            <!-- oninput ile ismi kaydeder -->
            <input type="text" id="v_danisman" placeholder="" oninput="localStorage.setItem('hafiza_danisman', this.value)">
        </div>
        <div class="form-group">
            <label>İletişim Numaranız</label>
            <!-- oninput ile numarayı kaydeder -->
            <input type="text" id="v_iletisim" placeholder="" oninput="localStorage.setItem('hafiza_iletisim', this.value)">
        </div>
    </div>

    <button class="islem-btn btn-pdf" onclick="pdfOlarakYazdir()">📄 PDF Ekranını Aç (Önizle ve Yazdır)</button>
    <button class="islem-btn btn-wp" onclick="whatsappYaziGonder()">💬 Direkt Yazı Olarak WhatsApp'a At</button>
</div>

<script>
    let urunSayaci = 0;

    window.onload = function() {
        // TARAYICI HAFIZASINI KONTROL ET VE YÜKLE
        let kayitliSirket = localStorage.getItem('hafiza_sirket');
        if(kayitliSirket) document.getElementById('v_sirket_adi').value = kayitliSirket;
        
        let kayitliDanisman = localStorage.getItem('hafiza_danisman');
        if(kayitliDanisman) document.getElementById('v_danisman').value = kayitliDanisman;
        
        let kayitliIletisim = localStorage.getItem('hafiza_iletisim');
        if(kayitliIletisim) document.getElementById('v_iletisim').value = kayitliIletisim;

        // Tarihleri Doldur
        document.getElementById('v_tarih').valueAsDate = new Date();
        let fDate = new Date(); fDate.setDate(fDate.getDate() + 15);
        document.getElementById('v_gecerlilik').valueAsDate = fDate;
        
        // Referans No Üret
        let d = new Date();
        document.getElementById('v_refno').value = "TR-" + d.getFullYear() + (d.getMonth()+1).toString().padStart(2,'0') + d.getDate().toString().padStart(2,'0') + "-" + Math.floor(1000 + Math.random() * 9000);
        
        urunKartiEkle();
    };

    function urunKartiEkle() {
        urunSayaci++;
        const kapsayici = document.getElementById('urunlerKapsayici');
        const kart = document.createElement('div');
        kart.className = 'urun-karti';
        kart.id = 'urun_karti_' + urunSayaci;
        
        const silButonu = urunSayaci > 1 ? `<button class="urun-karti-sil" onclick="urunSil('urun_karti_${urunSayaci}')">X</button>` : '';

        kart.innerHTML = `
            ${silButonu}
            <div class="form-group">
                <label>Ürün Adı / Model</label>
                <input type="text" class="u_ad" placeholder="">
            </div>
            <div class="form-group">
                <label>Teknik Detaylar (İsteğe Bağlı)</label>
                <textarea class="u_detay" placeholder=""></textarea>
            </div>
            <div class="form-group">
                <label>Liste Fiyatı (Üstü Çizilir)</label>
                <input type="text" class="u_liste" placeholder="0 ₺" oninput="paraVeToplam(this)">
            </div>
            <div class="form-group">
                <label>Net Teklif Tutarınız</label>
                <input type="text" class="u_net" placeholder="0 ₺" oninput="paraVeToplam(this)">
            </div>
        `;
        kapsayici.appendChild(kart);
    }

    function urunSil(kartId) {
        document.getElementById(kartId).remove();
        toplamHesapla();
    }

    function paraVeToplam(input) {
        let deger = input.value.replace(/[^0-9]/g, '');
        if (deger === '') { input.value = ''; } 
        else { input.value = new Intl.NumberFormat('tr-TR').format(parseInt(deger)) + ' ₺'; }
        toplamHesapla();
    }

    function toplamHesapla() {
        let toplam = 0;
        let netFiyatInputs = document.querySelectorAll('.u_net');
        netFiyatInputs.forEach(input => {
            let rakam = parseInt(input.value.replace(/[^0-9]/g, '')) || 0;
            toplam += rakam;
        });
        document.getElementById('v_genelToplamEkran').innerText = new Intl.NumberFormat('tr-TR').format(toplam) + ' ₺';
        return toplam;
    }

    function formatTarih(val) {
        if (!val) return "";
        let p = val.split('-');
        return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : val;
    }

    function pdfOlarakYazdir() {
        let v = id => document.getElementById(id).value;
        let sirket = v('v_sirket_adi');
        if(sirket.trim() === '') sirket = 'ŞİRKET ADI';
        
        let tarih = formatTarih(v('v_tarih'));
        let refno = v('v_refno');
        let musteri = v('v_musteri');
        let termin = v('v_termin_gun');
        let odeme = v('v_odeme');
        let gecerlilik = formatTarih(v('v_gecerlilik'));
        let danisman = v('v_danisman');
        let iletisim = v('v_iletisim');
        let genelToplam = document.getElementById('v_genelToplamEkran').innerText;

        let urunListesiHtml = '';
        let urunKartlari = document.querySelectorAll('.urun-karti');
        urunKartlari.forEach(kart => {
            let ad = kart.querySelector('.u_ad').value;
            let detay = kart.querySelector('.u_detay').value.replace(/\n/g, '<br>');
            let listeFiyati = kart.querySelector('.u_liste').value;
            let netFiyati = kart.querySelector('.u_net').value;
            let listeHtml = listeFiyati ? `<br><del style="font-size:8pt; color:#a0aec0;">${listeFiyati}</del>` : '';
            
            urunListesiHtml += `
                <tr>
                    <td><strong>${ad}</strong></td>
                    <td><span style="font-size: 8.5pt; color: #4a5568;">${detay}</span></td>
                    <td style="text-align: right; vertical-align: middle;">
                        ${listeHtml}
                        <div style="font-size:11pt; font-weight:bold;">${netFiyati}</div>
                    </td>
                </tr>
            `;
        });

        // Yeni Pencerede PDF şablonunu yarat
        let printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
            <head>
                <title>Fiyat Teklifi</title>
                <style>
                    /* Link ve Tarih Basılmasını Kesin Engelleyen Saf CSS */
                    @page { size: A4; margin: 0; }
                    body { 
                        font-family: 'Helvetica', 'Arial', sans-serif; 
                        margin: 0; 
                        padding: 15mm; 
                        color: #000; 
                        background-color: #fff;
                        -webkit-print-color-adjust: exact !important; 
                        print-color-adjust: exact !important;
                    }
                    @media print {
                        body { margin: 0; padding: 15mm; }
                        @page :left { @top-left { content: ""; } @bottom-left { content: ""; } }
                        @page :right { @top-right { content: ""; } @bottom-right { content: ""; } }
                    }

                    .p-header { display: flex; justify-content: space-between; border-bottom: 3px solid #1a365d; padding-bottom: 15px; margin-bottom: 25px; }
                    .p-title { font-size: 26pt; font-weight: 900; color: #1a365d; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
                    .p-meta { text-align: right; font-size: 10pt; color: #4a5568; line-height: 1.5; }
                    
                    .p-client-box { font-size: 11pt; margin-bottom: 20px; line-height: 1.5; }
                    
                    .p-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
                    .p-table th, .p-table td { border: 1px solid #cbd5e0; padding: 10px; text-align: left; vertical-align: top; }
                    .p-table th { background-color: #1a365d; color: white; font-weight: bold; font-size: 10pt; }
                    .p-table td { font-size: 10pt; }
                    
                    .p-totals { text-align: right; font-size: 14pt; font-weight: 900; color: #e53e3e; margin-bottom: 25px; padding-right: 5px; }
                    
                    .p-terms { background-color: #f7fafc; border: 1px solid #e2e8f0; padding: 15px; font-size: 9.5pt; border-left: 4px solid #1a365d; line-height: 1.6; }
                    
                    .p-legal { font-size: 7pt; color: #718096; text-align: justify; margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 10px; line-height: 1.4; }
                </style>
            </head>
            <body>
                <div class="p-header">
                    <div><h1 class="p-title">${sirket}</h1></div>
                    <div class="p-meta">
                        Tarih: <span>${tarih}</span><br>
                        Teklif No: <strong>${refno}</strong>
                    </div>
                </div>

                <div class="p-client-box">
                    <strong>Sayın,</strong> <span>${musteri}</span><br><br>
                    Mağazamızda yapmış olduğunuz görüşmelere istinaden, talep etmiş olduğunuz ürünlere ait kurumsal fiyat teklifi aşağıda bilgilerinize sunulmuştur. Bizi tercih ettiğiniz için teşekkür ederiz.
                </div>

                <div style="text-align: center; font-size: 14pt; font-weight: bold; color: #1a365d; margin-bottom: 10px;">FİYAT TEKLİFİ</div>

                <table class="p-table">
                    <thead>
                        <tr>
                            <th style="width: 50%">Ürün & Model Açıklaması</th>
                            <th style="width: 30%">Teknik Detaylar / İçerik</th>
                            <th style="width: 20%; text-align: right;">Net Tutar</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${urunListesiHtml}
                    </tbody>
                </table>

                <div class="p-totals">
                    Genel Toplam: <span>${genelToplam}</span>
                </div>

                <div class="p-terms">
                    <strong>TİCARİ BİLGİLENDİRME VE ŞARTLAR</strong><br>
                    • <strong>Termin Süresi:</strong> Sipariş onayı ve peşinat işlemlerine müteakip <strong><span>${termin}</span> iş günü</strong> içerisinde teslim edilecektir.<br>
                    • <strong>Ödeme Şekli:</strong> <span>${odeme}</span><br>
                    • <strong>Teslimat ve Kurulum:</strong> Nakliye ve kurulum masrafları satıcı firmaya (${sirket}) aittir. Ürün montajları yetkili servis güvencesiyle yapılacaktır.<br>
                    • <strong>Garanti:</strong> Tüm ürünler distribütör/marka yetkili servis garantisi altındadır.<br>
                    • <strong>Kur ve Geçerlilik:</strong> Bu teklif <strong><span>${gecerlilik}</span></strong> tarihine kadar geçerlidir. Fiyatlara KDV dahildir. Olası kur/enflasyon dalgalanmalarında değişiklik hakkı saklıdır.<br><br>
                    <strong>Müşteri Temsilcisi:</strong> <span>${danisman}</span> | <strong>İletişim:</strong> <span>${iletisim}</span>
                </div>

                <div class="p-legal">
                    <strong>KVKK ve YASAL AYDINLATMA METNİ:</strong> İşbu teklif belgesi, yalnızca bilgi amaçlı olup kesin satış sözleşmesi niteliği taşımamaktadır. Fiyatlarda stok durumuna göre değişiklik yapma hakkı ${sirket}'de saklıdır. Müşteri, işbu teklifin hazırlanması ve kendisine iletilmesi amacıyla kendi açık rızası ile beyan ettiği iletişim bilgilerinin, 6698 sayılı Kişisel Verilerin Korunması Kanunu (KVKK) kapsamında ${sirket} tarafından müşteri ilişkileri yönetimi ve bilgilendirme süreçleri dahilinde işlenmesini, saklanmasını ve bu iletişim kanalları üzerinden kendisine ulaşılmasını kabul ve beyan eder.
                </div>
            </body>
            </html>
        `);
        
        printWindow.document.close();
        printWindow.focus();
        
        setTimeout(() => { printWindow.print(); }, 250);
    }

    function whatsappYaziGonder() {
        let v = id => document.getElementById(id).value;
        let sirket = v('v_sirket_adi');
        
        let metin = `*${sirket} - KURUMSAL FİYAT TEKLİFİ*\n\n`;
        metin += `Sayın ${v('v_musteri')},\nMağazamızda yapmış olduğunuz görüşmelere istinaden, talep etmiş olduğunuz ürünlere ait kurumsal fiyat teklifi aşağıda bilgilerinize sunulmuştur.\n\n`;
        
        let urunKartlari = document.querySelectorAll('.urun-karti');
        urunKartlari.forEach((kart, index) => {
            let ad = kart.querySelector('.u_ad').value;
            let detay = kart.querySelector('.u_detay').value;
            let netFiyati = kart.querySelector('.u_net').value;
            
            metin += `*${index + 1}. Ürün:* ${ad}\n`;
            if(detay) metin += `_Teknik Detay: ${detay}_\n`;
            metin += `*Net Tutar:* ${netFiyati}\n\n`;
        });
        
        let genelToplam = document.getElementById('v_genelToplamEkran').innerText;
        metin += `------------------------\n`;
        metin += `*GENEL TOPLAM: ${genelToplam}*\n`;
        metin += `------------------------\n\n`;
        
        metin += `*TİCARİ BİLGİLENDİRME VE ŞARTLAR*\n`;
        metin += `• *Termin Süresi:* Sipariş onayı ve peşinat işlemlerine müteakip ${v('v_termin_gun')} iş günü içerisinde teslim edilecektir.\n`;
        metin += `• *Ödeme Şekli:* ${v('v_odeme')}\n`;
        metin += `• *Teslimat ve Kurulum:* Nakliye ve kurulum masrafları satıcı firmaya (${sirket}) aittir. Ürün montajları yetkili servis güvencesiyle yapılacaktır.\n`;
        metin += `• *Garanti:* Tüm ürünler distribütör/marka yetkili servis garantisi altındadır.\n`;
        metin += `• *Kur ve Geçerlilik:* Bu teklif ${formatTarih(v('v_gecerlilik'))} tarihine kadar geçerlidir. Fiyatlara KDV dahildir.\n\n`;
        
        metin += `*KVKK ve YASAL AYDINLATMA METNİ:*\n`;
        metin += `_İşbu teklif belgesi, yalnızca bilgi amaçlı olup kesin satış sözleşmesi niteliği taşımamaktadır. İletişim bilgileriniz, KVKK kapsamında ${sirket} tarafından müşteri ilişkileri süreçleri dahilinde işlenmektedir._\n\n`;

        metin += `*Müşteri Temsilcisi:* ${v('v_danisman')}\n`;
        metin += `*İletişim:* ${v('v_iletisim')}\n`;
        metin += `*Teklif No:* ${v('v_refno')}`;

        window.open(`https://wa.me/?text=${encodeURIComponent(metin)}`, '_blank');
    }
</script>
</body>
</html>
