<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Fatih AVM - Kurumsal Teklif Sistemi</title>
    <!-- PDF kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #3b82f6;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --border-color: #333333;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--surface-color);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 26px;
        }

        .section-title {
            font-size: 16px;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 30px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media(min-width: 600px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
            .full-width { grid-column: span 2; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, textarea {
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px; 
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        input[readonly] {
            background-color: #1a1a1a;
            color: #4ade80;
            font-weight: bold;
            cursor: not-allowed;
            border: none;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .action-buttons {
            margin-top: 35px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-share { background-color: #25D366; color: #fff; }
        .btn-download { background-color: var(--primary-color); color: #fff; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>FATİH AVM TEKLİF SİSTEMİ</h1>
    </div>

    <div class="section-title">Müşteri & Evrak Bilgileri</div>
    <div class="form-grid">
        <div class="form-group">
            <label>Müşteri / Firma Adı</label>
            <input type="text" id="v_musteri" placeholder="Örn: XYZ Mimarlık A.Ş.">
        </div>
        <div class="form-group">
            <label>Yetkili Kişi</label>
            <input type="text" id="v_yetkili" placeholder="Sayın ...">
        </div>
        <div class="form-group">
            <label>Teklif Tarihi</label>
            <input type="date" id="v_tarih">
        </div>
        <div class="form-group">
            <label>Referans / Teklif No</label>
            <input type="text" id="v_refno" readonly>
        </div>
    </div>

    <div class="section-title">Ürün & Detaylar</div>
    <div class="form-grid">
        <div class="form-group full-width">
            <label>Ürün / Hizmet Adı</label>
            <input type="text" id="v_urun" placeholder="Örn: Bosch Profesyonel Endüstriyel Set">
        </div>
        <div class="form-group full-width">
            <label>Teknik Detaylar ve Açıklama</label>
            <textarea id="v_detay" placeholder="Ürünün özelliklerini buraya yazın..."></textarea>
        </div>
    </div>

    <div class="section-title">Fiyatlandırma</div>
    <div class="form-grid">
        <div class="form-group">
            <label>Liste Fiyatı (Gerçek Fiyat)</label>
            <input type="number" id="v_liste" placeholder="Örn: 50000">
        </div>
        <div class="form-group">
            <label>Verilen Özel Fiyat Teklifi</label>
            <input type="number" id="v_teklif" placeholder="Örn: 42000">
        </div>
    </div>

    <div class="section-title">Ticari Şartlar & İletişim</div>
    <div class="form-grid">
        <div class="form-group">
            <label>Teklif Geçerlilik Tarihi</label>
            <input type="date" id="v_gecerlilik">
        </div>
        <div class="form-group">
            <label>Teslimat Süresi</label>
            <input type="text" id="v_teslimat" value="Stoktan Hemen Teslim">
        </div>
        <div class="form-group">
            <label>Danışman / Temsilci Adı</label>
            <input type="text" id="v_danisman" value="Fatih">
        </div>
        <div class="form-group">
            <label>İletişim / WhatsApp</label>
            <input type="text" id="v_iletisim" value="+90 537 358 30 95">
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-share" onclick="pdfIslemi('paylas')">
            PDF Oluştur ve Gönder (WhatsApp/Mail)
        </button>
        <button class="btn-download" onclick="pdfIslemi('indir')">
            Sadece Cihaza İndir
        </button>
    </div>
</div>

<script>
    function referansUret() {
        let bugun = new Date();
        let tarih = bugun.getFullYear().toString() + 
                    (bugun.getMonth() + 1).toString().padStart(2, '0') + 
                    bugun.getDate().toString().padStart(2, '0');
        let rastgele = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('v_refno').value = "TR-" + tarih + "-" + rastgele;
    }

    window.onload = function() {
        document.getElementById('v_tarih').valueAsDate = new Date();
        let gelecek = new Date();
        gelecek.setDate(gelecek.getDate() + 15); 
        document.getElementById('v_gecerlilik').valueAsDate = gelecek;
        referansUret();
    };

    function formatTarih(tarihDegeri) {
        if (!tarihDegeri) return "";
        let parcalar = tarihDegeri.split('-');
        return parcalar.length === 3 ? `${parcalar[2]}.${parcalar[1]}.${parcalar[0]}` : tarihDegeri;
    }

    // Telefon tarayıcılarının ekranı boş çizmesini engelleyen garanti rendering metodu
    function renderIcinKutuOlustur() {
        let v = id => document.getElementById(id).value || "";
        
        let p_tarih = formatTarih(v('v_tarih'));
        let p_gecerlilik = formatTarih(v('v_gecerlilik'));
        
        let fmt = new Intl.NumberFormat('tr-TR');
        let listeFiyati = parseFloat(v('v_liste')) || 0;
        let teklifFiyati = parseFloat(v('v_teklif')) || 0;
        
        let p_liste = fmt.format(listeFiyati) + " ₺";
        let p_teklif = fmt.format(teklifFiyati) + " ₺";
        let p_detay = v('v_detay').replace(/\n/g, '<br>');

        // Daha önce oluşturulmuş gizli kutu varsa sil
        let eskiKutu = document.getElementById('garanti-pdf-kutusu');
        if(eskiKutu) eskiKutu.remove();

        // PDF için özel, genişliği sabit, bembeyaz bir arka plan kutusu oluştur
        let kutu = document.createElement('div');
        kutu.id = 'garanti-pdf-kutusu';
        
        // CSS ile ekran dışına itiyoruz ama display:none KULLANMIYORUZ!
        kutu.style.position = 'fixed';
        kutu.style.left = '-9999px';
        kutu.style.top = '0';
        kutu.style.width = '800px'; 
        kutu.style.backgroundColor = '#ffffff';
        kutu.style.color = '#000000';
        kutu.style.zIndex = '-9999';
        
        kutu.innerHTML = `
        <div style="padding: 40px; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 14px; line-height: 1.6; box-sizing: border-box; background-color:#ffffff;">
            
            <table style="width: 100%; border-bottom: 2px solid #1a365d; padding-bottom: 15px; margin-bottom: 40px; border-collapse: collapse;">
                <tr>
                    <td style="width: 50%; vertical-align: bottom;">
                        <h1 style="font-size: 32px; font-weight: 900; color: #1a365d; margin: 0; text-transform: uppercase;">FATİH AVM</h1>
                    </td>
                    <td style="width: 50%; text-align: right; vertical-align: bottom; font-size: 13px; color: #4a5568;">
                        Tarih: ${p_tarih}<br>
                        Teklif No: <strong>${v('v_refno')}</strong>
                    </td>
                </tr>
            </table>

            <div style="margin-bottom: 40px; font-size: 15px;">
                <strong>Sayın Yetkili,</strong> ${v('v_yetkili')}<br>
                <strong>Firma:</strong> ${v('v_musteri')}<br><br>
                Görüşmelerimize istinaden, kurumunuzun ihtiyaçları doğrultusunda hazırladığımız fiyat teklifi ve teknik detaylar aşağıda bilgilerinize sunulmuştur. Göstermiş olduğunuz ilgiye teşekkür ederiz.
            </div>

            <div style="text-align: center; font-size: 22px; font-weight: bold; margin-bottom: 25px; color: #2d3748;">
                FİYAT TEKLİFİ
            </div>

            <table style="width: 100%; border-collapse: collapse; margin-bottom: 40px;">
                <thead>
                    <tr>
                        <th style="width: 5%; border: 1px solid #cbd5e0; padding: 15px; background-color: #f7fafc; color: #1a365d; text-align: left;">No</th>
                        <th style="width: 55%; border: 1px solid #cbd5e0; padding: 15px; background-color: #f7fafc; color: #1a365d; text-align: left;">Ürün / Hizmet Açıklaması</th>
                        <th style="width: 20%; border: 1px solid #cbd5e0; padding: 15px; background-color: #f7fafc; color: #1a365d; text-align: left;">Liste Fiyatı</th>
                        <th style="width: 20%; border: 1px solid #cbd5e0; padding: 15px; background-color: #f7fafc; color: #1a365d; text-align: left;">Net Teklif</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="border: 1px solid #cbd5e0; padding: 15px; vertical-align: top;">1</td>
                        <td style="border: 1px solid #cbd5e0; padding: 15px; vertical-align: top;">
                            <strong style="font-size: 16px;">${v('v_urun')}</strong><br><br>
                            <span style="font-size: 13px; color: #4a5568;">${p_detay}</span>
                        </td>
                        <td style="border: 1px solid #cbd5e0; padding: 15px; vertical-align: top;"><del>${p_liste}</del></td>
                        <td style="border: 1px solid #cbd5e0; padding: 15px; vertical-align: top; color: #000; font-size: 16px;"><strong>${p_teklif}</strong></td>
                    </tr>
                </tbody>
            </table>

            <div style="text-align: right; margin-bottom: 40px;">
                <div style="font-size: 20px; font-weight: bold; color: #e53e3e;">Genel Toplam: ${p_teklif}</div>
            </div>

            <div style="background-color: #f7fafc; padding: 20px; border-left: 4px solid #1a365d; font-size: 14px; margin-bottom: 50px;">
                <strong>TİCARİ ŞARTLAR</strong><br><br>
                • <strong>Teklif Geçerlilik:</strong> Bu teklif ${p_gecerlilik} tarihine kadar geçerlidir.<br>
                • <strong>Teslimat:</strong> ${v('v_teslimat')}
            </div>

            <table style="width: 100%; border-collapse: collapse; margin-top: 60px;">
                <tr>
                    <td style="width: 50%; vertical-align: top;">
                        <strong>Firma Kaşe & İmza (Onay)</strong><br><br><br><br>
                        ...................................................
                    </td>
                    <td style="width: 50%; vertical-align: top; text-align: center;">
                        <strong>Müşteri Temsilcisi</strong><br>
                        ${v('v_danisman')}<br>
                        İletişim: ${v('v_iletisim')}<br>
                        <strong>FATİH AVM</strong>
                    </td>
                </tr>
            </table>
        </div>
        `;
        
        document.body.appendChild(kutu);
        return kutu;
    }

    async function pdfIslemi(islemTuru) {
        let hedefKutu = renderIcinKutuOlustur();
        
        let musteri = document.getElementById('v_musteri').value || "Musteri";
        let referans = document.getElementById('v_refno').value;
        let fileName = 'Teklif_' + musteri.replace(/ /g, '') + '_' + referans;

        let opt = {
            margin:       [10, 0, 10, 0], // Üst, Sağ, Alt, Sol boşluklar
            filename:     fileName + '.pdf',
            image:        { type: 'jpeg', quality: 1.0 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        if (islemTuru === 'indir') {
            html2pdf().set(opt).from(hedefKutu).save().then(() => {
                hedefKutu.remove(); // İşlem bitince DOM'dan temizle
            });
        } 
        else if (islemTuru === 'paylas') {
            try {
                let pdfWorker = html2pdf().set(opt).from(hedefKutu);
                let pdfBlob = await pdfWorker.output('blob');
                
                if (navigator.share && navigator.canShare) {
                    let file = new File([pdfBlob], fileName + '.pdf', { type: 'application/pdf' });
                    
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: 'Fiyat Teklifi',
                            text: 'Fatih AVM - Kurumsal Fiyat Teklifiniz Ektedir.',
                            files: [file]
                        });
                        hedefKutu.remove();
                    } else {
                        hedefKutu.remove();
                        alert("Cihazınız PDF paylaşımını desteklemiyor. Dosya indiriliyor...");
                        html2pdf().set(opt).from(renderIcinKutuOlustur()).save();
                    }
                } else {
                    hedefKutu.remove();
                    alert("Tarayıcınız paylaşım menüsünü desteklemiyor. Dosya indiriliyor...");
                    html2pdf().set(opt).from(renderIcinKutuOlustur()).save();
                }
            } catch (err) {
                console.log("Hata: ", err);
                hedefKutu.remove();
            }
        }
    }
</script>

</body>
</html>
